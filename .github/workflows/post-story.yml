name: Daily Instagram Story

on:
  schedule:
    # GitHub delays or drops scheduled runs under load (observed gaps of ~5 h),
    # so we fire many triggers around the target time and let the script decide.
    # The script posts once per day, inside POST_HOUR..POST_HOUR+POST_WINDOW_HOURS
    # in TIMEZONE. Cron below is UTC: 06:00 UTC = 13:00 Asia/Bangkok.
    - cron: "1,11,21,31,41,51 6 * * *"   # every 10 min, 13:00-13:59 Jakarta
    - cron: "3,23,43 7,8 * * *"          # every 20 min, 14:00-15:59 Jakarta
    - cron: "17 9,10,11,12 * * *"        # hourly fallback until 19:59 Jakarta
  workflow_dispatch:
    inputs:
      force:
        description: "Post right now, ignoring the time window and once-per-day guard"
        type: boolean
        default: false
      check_pat:
        description: "Only verify that the GH_PAT secret can manage repo secrets (no post)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit state.json back to the repo

concurrency:
  group: post-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TIMEZONE: Asia/Bangkok          # <- change to your IANA timezone
      POST_HOUR: "13"                 # <- local hour to post
      POST_WINDOW_HOURS: "7"          # late runs may still post until 19:59
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
      TOKEN_OUT_FILE: /tmp/ig_new_token.txt

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check GH_PAT can manage secrets
        if: inputs.check_pat
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_PAT secret is not set"; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --jq '.key_id' > /dev/null
          echo "GH_PAT OK: it can read/write this repo's Actions secrets."

      - name: Install timezone data
        if: ${{ !inputs.check_pat }}
        run: python -m pip install -q tzdata

      - name: Post story
        if: ${{ !inputs.check_pat }}
        run: python post_story.py ${{ inputs.force && '--force' || '' }}

      - name: Save progress (state.json)
        if: always()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update story state [skip ci]"
            git push
          fi

      - name: Store refreshed access token as repo secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -s "$TOKEN_OUT_FILE" ]; then
            echo "Token not refreshed this run."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Token was refreshed but GH_PAT secret is missing, so it could not be saved. Add GH_PAT (see README) or paste a new IG_ACCESS_TOKEN manually before it expires."
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_OUT_FILE"
          echo "IG_ACCESS_TOKEN secret updated."
